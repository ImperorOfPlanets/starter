<style>
    /* Контейнер для стрелки справа по центру */
    #toggleMenuBtn {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      background-color: #007bff;
      color: white;
      border-radius: 4px 0 0 4px;
      cursor: pointer;
      user-select: none;
      font-size: 24px;
      width: 36px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1050; /* выше контента */
    }
  
    /* Сам блок меню */
    #sideMenu {
      position: fixed;
      top: 50%;
      right: 36px; /* слева от кнопки */
      transform: translateY(-50%);
      background: white;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 180px;
      display: none;
      z-index: 1049;
      border-radius: 4px 0 0 4px;
      padding: 10px 0;
    }
  
    #sideMenu button {
      width: 100%;
      border: none;
      background: none;
      padding: 10px 20px;
      text-align: left;
      font-weight: 500;
      cursor: pointer;
    }
  
    #sideMenu button:hover {
      background-color: #007bff;
      color: white;
    }
  </style>
  
  <!-- Кнопка стрелка -->
  <div id="toggleMenuBtn" title="Toggle menu"><span id="arrowIcon">&lt;</span></div>
  
  <!-- Меню -->
  <div id="sideMenu" class="shadow-sm">
    <button class="menu-item" data-action="globalVariables">Глобальные переменные</button>
    <button class="menu-item" data-action="modules">Модули</button>
  </div>
  
  <script>
    $(document).ready(function() {
      const arrowIcon = $('#arrowIcon');
      const sideMenu = $('#sideMenu');
      const toggleBtn = $('#toggleMenuBtn');
      
      // Флаг состояния меню: скрыто или показано
      let isMenuVisible = false;
      
      // Переключение меню и стрелки
      toggleBtn.click(function() {
        if (isMenuVisible) {
          sideMenu.hide();
          arrowIcon.text('<');
        } else {
          sideMenu.show();
          arrowIcon.text('>');
        }
        isMenuVisible = !isMenuVisible;
      });
  
      // Обработчик клика по пунктам меню
      $('.menu-item').click(function() {
        const action = $(this).data('action');
        
        // Формируем FormData
        var formData = new FormData();
        formData.append('section', 'develop');
        formData.append('action', action);
        
        // Заголовок для JSON, если нужно
        var headers = new Headers();
        headers.append('Accept', 'application/json');
        
        fetch('/', {
          method: 'POST',
          body: formData,
          headers: headers
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('Network error');
          }
          return response.json();
        })
        .then(result => {
          if (result.status === 'success') {
            alert('Данные отправлены успешно!');
            // можно добавить какое-то действие
          } else {
            alert('Ошибка: ' + (result.message || ''));
          }
        })
        .catch(error => {
          console.error('AJAX Error:', error);
          alert('Ошибка сети или сервера');
        });
      });
    });
  </script>
